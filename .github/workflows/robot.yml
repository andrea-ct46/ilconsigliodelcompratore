name: Robot Prezzi Amazon (sospeso)

# Sospeso senza scadenza su richiesta del proprietario il 21 ottobre 2026.
# Nessun cron, trigger push o avvio dello scraper.
# Riattivare soltanto su esplicita richiesta del proprietario.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sospeso:
    runs-on: ubuntu-latest
    steps:
      - name: Bot disattivato
        run: echo "Bot prezzi sospeso. Nessuna raccolta o modifica al catalogo." >> "$GITHUB_STEP_SUMMARY"
