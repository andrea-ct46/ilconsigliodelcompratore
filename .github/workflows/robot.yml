name: Robot Prezzi Amazon (sospeso)

# Sospensione senza scadenza dal 17 ottobre 2026.
# Nessuna pianificazione e nessuna chiamata a scraper.py.
# Riattivare soltanto dopo una decisione esplicita del proprietario.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sospeso:
    runs-on: ubuntu-latest
    steps:
      - name: Scraper disattivato
        run: echo "Scraper sospeso senza scadenza. Nessun link Amazon aperto e nessun dato modificato." >> "$GITHUB_STEP_SUMMARY"
